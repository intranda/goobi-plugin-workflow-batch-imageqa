# Minimal goobi configuration for the unit tests.
#
# ConfigurationHelper resolves 'goobi_config.properties' via commons-configuration. When the file is
# not present as a real file on disk, it is picked up from inside the workflow-core jar; in that case
# PropertiesConfiguration.getFile() returns null and the ConfigurationHelper constructor fails with
# "Cannot invoke java.io.File.getAbsolutePath()". The tests therefore point
# ConfigurationHelper.configFileName at this file (see the @BeforeClass methods).
goobiFolder=/opt/digiverso/goobi/
